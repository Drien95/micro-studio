# Build de l'exécutable Windows et publication sur les tags de version (vX.Y.Z).
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Le tag correspond à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME ≠ version v$version"; exit 1; }
      - name: Tests
        run: cargo test --release --locked
      - name: Compilation
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: micro-studio-windows
          path: target/release/micro-studio.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: micro-studio-windows
      - name: Notes de version extraites du CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          files: micro-studio.exe
          body_path: notes.md
